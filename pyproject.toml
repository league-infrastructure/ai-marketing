[project]
name = "league-image-generator"
version = "0.1.0"
description = "MCP server that generates and evaluates League of Amazing Programmers marketing images via OpenRouter image models."
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "playwright>=1.40.0",
    "pillow>=11.0.0",
    "numpy>=2.0.0",
    "qrcode>=8.2",
    "jinja2>=3.1.6",
    "markdown>=3.10.2",
]

[tool.uv]
package = false
